<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="ui.css">
</head>
<body>
  <h3>Tab Audio Recorder</h3>
  <div id="status">
    <span class="dot" id="dot"></span>
    <span id="statusText">Ready</span>
  </div>
  <div id="recInfo" class="rec-info"></div>
  <div id="error" class="error"></div>
  <div id="waveform"></div>
  <button id="recordBtn">Start Recording</button>
  <button id="pauseBtn">Pause</button>
  <button id="autoPauseBtn">Auto-pause: Off</button>
  <button id="muteBtn">Mute playback: Off</button>
  <button id="popoutBtn">Pop out &#8599;</button>
  <p class="hint">Pick where to save. The file is updated every ~10&nbsp;s, so a crash loses at most a few seconds.</p>
  <script type="module" src="ui.js"></script>
</body>
</html>

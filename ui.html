<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="ui.css">
</head>
<body>
  <h3>Tab Audio Recorder</h3>
  <div id="status">
    <span class="dot" id="dot"></span>
    <span id="statusText">Ready</span>
  </div>
  <div id="recInfo" class="rec-info"></div>
  <div id="error" class="error"></div>
  <div id="waveform"></div>
  <input id="nameInput" type="text" placeholder="Recording name (optional)" autocomplete="off" spellcheck="false">
  <button id="recordBtn">Start Recording</button>
  <button id="pauseBtn">Pause</button>
  <button id="autoPauseBtn">Auto-pause: Off</button>
  <button id="muteBtn">Mute playback: Off</button>
  <button id="popoutBtn">Pop out &#8599;</button>
  <p class="hint">Pick a folder to save into. Both a crash-safe .webm and an .m4a copy are saved there under this name, automatically on stop.</p>
  <div id="m4aNotice" class="m4a-notice" style="display:none">M4A not supported on this browser — only WebM will be saved</div>
  <div id="version" class="version"></div>
  <script type="module" src="ui.js"></script>
</body>
</html>
